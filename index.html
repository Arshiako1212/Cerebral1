<html lang="fa" dir="rtl">
<head>

<style>
:root{--bg:#0d1117;--card:#151c27;--card2:#1b2531;--line:#232f42;--tx:#e7ecf3;--mut:#8b9bb4;--ac:#3ddca0;--bl:#2f8fd8;--bad:#ff6b6b;--grad:linear-gradient(90deg,#23b988,#2f8fd8);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{--bg:#f3f6fa;--card:#fff;--card2:#e9eef5;--line:#d5dde8;--tx:#16202e;--mut:#5b6b82;--ac:#13a371;--bl:#2678b8;color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.6 Vazirmatn,Tahoma,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:14px 18px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px}
main{flex:1;overflow-y:auto;padding:8px 16px 20px}
nav{display:flex;background:linear-gradient(180deg,#151c27,#10161f);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

nav button .i{font-size:20px}

.pt .g{flex:1;min-width:0}.pt b{display:block}

.dp .u{grid-column:2}.dp .l{grid-row:2;grid-column:1}.dp .dn{grid-row:2;grid-column:2}.dp .r{grid-row:2;grid-column:3}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}th{color:var(--mut);font-weight:500}
.empty{text-align:center;color:var(--mut);padding:28px 10px}

.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dc{background:var(--card);border-radius:16px;padding:10px 8px 12px;text-align:center}.dc canvas{width:100%;aspect-ratio:220/270;touch-action:manipulation}.dc b{display:block;font-size:13.5px;line-height:1.5}.dc .st{font-size:12px}
.tv{position:fixed;inset:0;z-index:50}.tv.dim{background:rgba(0,0,0,.66)}.tsp{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.66);border:2px solid #ffd54a;pointer-events:none;display:none}.tcard{position:fixed;left:10px;right:10px;z-index:51;background:var(--card);border:2px solid #ffd54a;border-radius:16px;padding:10px 12px;display:flex;gap:10px;max-height:62vh;overflow:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}.tcard canvas{width:64px;height:78px;flex:none}.tcard b{font-size:15px}.tbd{font-size:13px;line-height:1.7;margin:4px 0 6px}
.tg{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:rgba(61,220,160,.14);color:var(--ac)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
</style>

<body>
<header><div><h1>CerebralSupport</h1><div class="sub" id="sb"></div></div><div class="row"><button class="btn" id="tr" aria-label="آموزش">❓</button><button class="btn" id="th" aria-label="تغییر تم">🌓</button></div></header>
<main id="m"></main>
<nav id="nv"></nav>
<dialog id="dg"></dialog>
<script>
const $=s=>document.querySelector(s);
const TABS=[["home","🏠","داشبورد"],["pat","👥","بیماران"],["game","🎮","بازی‌ها"],["rep","📊","گزارش‌ها"],["dev","👨‍💻","توسعه‌دهندگان"]];
let S={patients:[],sessions:[],sel:null,nid:1,theme:""};
try{const r=localStorage.getItem("cs1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const AP=location.pathname.replace(/\/+$/,"")==="/admin",TKEY=AP?"cs_atk":"cs_tk";
let SRV=false,TK="";try{TK=localStorage.getItem(TKEY)||""}catch(e){}
const save=()=>{try{if(SRV)localStorage.setItem("cs_pref",JSON.stringify({sel:S.sel,theme:S.theme,tour:S.tour}));else localStorage.setItem("cs1",JSON.stringify(S))}catch(e){}};
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=t=>new Date(t).toLocaleDateString("fa-IR",{month:"short",day:"numeric"});
const fdt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const cur=()=>S.patients.find(p=>p.id===S.sel);
const mine=id=>S.sessions.filter(x=>x.pid===id);
if(S.theme)document.documentElement.dataset.theme=S.theme;
$("#tr").onclick=()=>tour();
$("#th").onclick=()=>{const l=getComputedStyle(document.documentElement).colorScheme==="light";S.theme=l?"dark":"light";document.documentElement.dataset.theme=S.theme;save()};
let tab="home",gt=null;

$("#nv").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.t)};
function go(t){stopGame();tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));const p=cur();$("#sb").textContent=p?"بیمار: "+p.name:"بیماری انتخاب نشده";({home,pat,game,rep,dev,adm})[t]();$("#m").scrollTop=0}
function home(){const p=cur(),ss=p?mine(p.id):[],best=ss.reduce((a,x)=>Math.max(a,x.score),0),lv=ss.reduce((a,x)=>Math.max(a,x.level),1),last=ss.length?ss[ss.length-1]:null;
$("#m").innerHTML=`<div class="card"><div class="st">خوش آمدید</div><div style="font-size:18px;font-weight:700">${p?esc(p.name):"اول یک بیمار انتخاب کنید"}</div>${p?"":'<button class="btn p w" style="margin-top:12px" onclick="go(\'pat\')">رفتن به بیماران</button>'}</div>
<div class="grid"><div class="card"><div class="st">سطح فعلی</div><div class="sv">${fa(lv)}</div></div><div class="card"><div class="st">بهترین امتیاز</div><div class="sv">${fa(best)}</div></div><div class="card"><div class="st">بازی‌های انجام‌شده</div><div class="sv">${fa(ss.length)}</div></div><div class="card"><div class="st">آخرین جلسه</div><div class="sv" style="font-size:18px;padding-top:6px">${last?fd(last.t):"—"}</div></div></div>
<button class="btn p w" onclick="go('game')">🎮 رفتن به بازی‌ها</button>
<div class="card" style="margin-top:14px"><b>داده‌ها</b><div class="st" style="margin:2px 0 10px">${SRV?"👤 "+esc(UNAME)+" — 🟢 متصل به سرور: اطلاعات روی پایگاه‌داده ذخیره می‌شود و روی همه‌ی دستگاه‌ها یکسان است. «بازیابی» فایل پشتیبان را به داده‌های سرور اضافه می‌کند.":"اطلاعات فقط روی همین دستگاه ذخیره می‌شود. برای نگه‌داری یا انتقال به دستگاه دیگر، پشتیبان بگیرید."}</div><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="bkp()">💾 پشتیبان‌گیری</button><button class="btn" onclick="document.getElementById('rf').click()">📂 بازیابی</button><button class="btn" onclick="csvx()">📄 خروجی Excel</button><button class="btn" onclick="tour()">❓ آموزش دوربین</button>${SRV?'<button class="btn" onclick="logout()">🚪 خروج</button>':""}</div><input type="file" id="rf" accept=".json,application/json" hidden onchange="rst(this.files[0])"></div>`}
function pat(){const L=S.patients.map(p=>{const n=mine(p.id).length;return `<div class="pt ${p.id===S.sel?"sel":""}" data-id="${p.id}"><div class="av">${esc(p.name[0])}</div><div class="g"><b>${esc(p.name)}</b><span class="st">${p.age?fa(p.age)+" سال · ":""}${p.gender||""} · ${fa(n)} جلسه</span></div><button class="btn" data-e="${p.id}">ویرایش</button></div>`}).join("");
$("#m").innerHTML=`<button class="btn p w" id="ad" style="margin-bottom:12px">＋ بیمار جدید</button>${L||'<div class="empty">هنوز بیماری ثبت نشده. با دکمه بالا اضافه کنید.</div>'}`;
$("#ad").onclick=()=>form();$("#m").onclick=e=>{const b=e.target.closest("[data-e]");if(b)return form(+b.dataset.e);const c=e.target.closest("[data-id]");if(c){S.sel=+c.dataset.id;save();go("pat")}}}
function form(id){const p=S.patients.find(x=>x.id===id)||{};const d=$("#dg");
d.innerHTML=`<h3 style="margin-top:0">${id?"ویرایش بیمار":"بیمار جدید"}</h3><label>نام و نام خانوادگی</label><input id="fn" value="${esc(p.name)}"><label>سن</label><input id="fa" type="number" inputmode="numeric" value="${p.age||""}"><label>جنسیت</label><select id="fg"><option>پسر</option><option>دختر</option></select><label>یادداشت</label><textarea id="fno" rows="2">${esc(p.notes)}</textarea><div class="row"><button class="btn p" style="flex:1" id="ok">ذخیره</button><button class="btn" id="cn">انصراف</button>${id?'<button class="btn d" id="dl">حذف</button>':""}</div>`;
$("#fg").value=p.gender||"پسر";d.showModal();$("#cn").onclick=()=>d.close();
$("#ok").onclick=async()=>{const n=$("#fn").value.trim();if(!n){$("#fn").focus();return}const o={name:n,age:+$("#fa").value||0,gender:$("#fg").value,notes:$("#fno").value};
if(SRV){try{if(id){await api("PUT","/api/patients/"+id,o);Object.assign(p,o)}else{o.id=(await api("POST","/api/patients",o)).id;S.patients.push(o);S.sel=o.id}}catch(e){return sfail(e)}}
else if(id)Object.assign(p,o);else{o.id=S.nid++;S.patients.push(o);S.sel=o.id}save();d.close();go("pat")};
if(id)$("#dl").onclick=async()=>{if(confirm("این بیمار و همه جلسه‌هایش حذف شود؟")){if(SRV){try{await api("DELETE","/api/patients/"+id)}catch(e){return sfail(e)}}S.patients=S.patients.filter(x=>x.id!==id);S.sessions=S.sessions.filter(x=>x.pid!==id);if(S.sel===id)S.sel=null;save();d.close();go("pat")}}}
/* ---- Games (ported from desktop/app/games) ---- */
const W=480,H=400;
const GL=[
["hand","🐍","مار دوربینی","دست‌تان را جلوی دوربین حرکت دهید تا مار روی بادکنک‌ها برود؛ روی هر بادکنک ۴ بار مشت کنید.","دوربین","h"],
["garden","🌸","باغ شکوفهٔ دوربینی","مچ را جلوی دوربین چپ و راست خم کنید تا زنبور به غنچه برسد، بعد مشت را ببندید و باز کنید.","دوربین","w"],
["dino","🦖","پرش مشتی","با هر مشت‌کردن جلوی دوربین می‌پرد و از مانع‌ها رد می‌شود.","دوربین","p"],
["shooter","🚀","تیرانداز مشتی","با هر مشت شلیک کنید و شهاب‌سنگ‌ها را قبل از رسیدن به سفینه بزنید.","دوربین","p"],
["balloon","🎈","بادکنک مشتی","مشت را نیمه‌بسته و ثابت نگه دارید تا بادکنک باد شود؛ بیش از حد فشار ندهید.","دوربین","p"],
["bubble","🫧","حباب‌ترکان مشتی","وقتی حباب به حلقه رسید مشت کنید؛ هرچه دقیق‌تر، امتیاز بیشتر.","دوربین","p"],
["grading","🎚️","درجه‌بندی مشت","مشت را به اندازه‌ی سبک، متوسط یا سنگین ببندید و کمی نگه دارید.","دوربین","p"],
["car","🏎️","رانندگی با دست","دست چپ/راست = لاین، مشت = گاز، دست باز و پایین = ترمز. سکه‌ها را بگیرید.","دوربین","c"],
["space","🛸","ماموریت فضایی با دست","همان رانندگی با دست، در فضا: ستاره جمع کنید و از سیارک‌ها فرار کنید.","دوربین","c"]];
const GN={};GL.forEach(g=>GN[g[0]]=g[2]);
const nc=()=>({s:0,l:1,ok:0,bad:0,t:0,pm:0,ps:0,pn:0}),ni=()=>({p:0,tp:0,edge:false,sq:0,up:false,u:0,mx:W/2,my:H/2,lane:0,gas:0,brake:0,cp:0,pd:0,kf:0,kfs:0,lL:0,lR:0,fr:0,sw:0,fb:0});
let C=nc(),I=ni(),FX=[],GM=null,raf=0;
function add(n,x,y,col,lb){C.s=Math.max(0,C.s+n);FX.push({x,y,l:.9,c:col||"#ffdc78",s:lb||(n>0?"+"+fa(n):"−"+fa(-n))})}
function bg(c,a,b){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,W,H)}
function tx(c,s,x,y,z,col,al){c.fillStyle=col||"#fff";c.font="bold "+z+"px Vazirmatn,Tahoma,sans-serif";c.textAlign=al||"center";c.fillText(s,x,y)}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(0,r),0,7);c.fill()}
function rr(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function stars(c,n,t){for(let i=0;i<n;i++){c.globalAlpha=.4+.6*Math.abs(Math.sin(t+i));c.fillStyle="#fff";c.fillRect((i*97)%W,(i*53)%H,2,2)}c.globalAlpha=1}
function gauge(c,bands){const x=W-46,y0=50,h=300;rr(c,x,y0,22,h,8,"rgba(255,255,255,.12)");bands.forEach(b=>{const t=y0+h*(1-b[1]/100),bt=y0+h*(1-b[0]/100);c.fillStyle=b[2];c.fillRect(x,t,22,bt-t)});rr(c,x-6,y0+h*(1-I.p/100)-4,34,8,4,"#fff");tx(c,"فشار",x+11,y0-10,12,"#9fb0c8")}
const MK={};
MK.dino=()=>{const gy=320;let y=gy,vy=0,ob=[],sp=1,sx=0,sq=1,fl=0,sh=0;
return{u(dt){const v=190+C.l*28;if(I.edge&&y>=gy){vy=-640;sq=1.3}
vy+=1800*dt;y+=vy*dt;if(y>=gy){if(vy>200)sq=.75;y=gy;vy=0}sq+=(1-sq)*Math.min(1,dt*10);sx+=v*dt;
sp-=dt;if(sp<=0){ob.push({x:W+20,h:30+Math.random()*40});sp=1.6+Math.random()*1.2}
ob.forEach(o=>{o.x-=v*dt;if(!o.p&&70+36>o.x&&70<o.x+28&&y>gy-o.h){o.p=1;C.bad++;add(-5,90,gy-70,"#ff6b6b");fl=.15;sh=.25}
else if(!o.p&&o.x+28<70){o.p=1;C.ok++;add(10*C.l,90,gy-70)}});
ob=ob.filter(o=>o.x>-50);fl=Math.max(0,fl-dt);sh=Math.max(0,sh-dt)},
d(c){c.save();if(sh>0)c.translate((Math.random()-.5)*8,(Math.random()-.5)*8);bg(c,"#2a2f55","#e98a6a");c.fillStyle="rgba(20,25,50,.45)";
for(let i=0;i<4;i++){const hx=(((i*200-sx*.2)%(W+200))+W+200)%(W+200)-100;c.beginPath();c.arc(hx,gy+30,100,Math.PI,0);c.fill()}
c.fillStyle="#1c2a3a";c.fillRect(0,gy,W,H-gy);c.fillStyle="#3ddca0";c.fillRect(0,gy,W,3);
ob.forEach(o=>rr(c,o.x,gy-o.h,28,o.h,6,"#2f8f5a"));
c.save();c.translate(88,y);c.scale(1/sq,sq);c.translate(-88,-y);rr(c,70,y-36,36,36,10,fl>0?"#ff6b6b":"#3ddca0");circ(c,97,y-24,4,"#06281c");c.restore();c.restore()}}};
MK.shooter=()=>{const ly=200;let ms=[],bs=[],sp=1,cd=0,ex=[],t=0;
return{u(dt){t+=dt;cd-=dt;const v=120+C.l*16;if(I.edge&&cd<=0){bs.push({x:90,y:ly});cd=.28}
sp-=dt;if(sp<=0){ms.push({x:W+30,r:16+Math.random()*14,m:.85+Math.random()*.35,a:0});sp=1.4+Math.random()}
bs.forEach(b=>b.x+=620*dt);bs=bs.filter(b=>b.x<W+20);
ms.forEach(m=>{m.x-=v*m.m*dt;m.a+=dt*2;const b=bs.find(b=>Math.hypot(b.x-m.x,b.y-ly)<=m.r+5);
if(b){bs.splice(bs.indexOf(b),1);m.d=1;C.ok++;add(10*C.l,m.x,ly-25);ex.push({x:m.x,l:.4,c:"#ffb347"})}
else if(m.x-m.r<=90){m.d=1;C.bad++;add(-5,90,ly-35,"#ff6b6b");ex.push({x:90,l:.4,c:"#ff6b6b"})}});
ms=ms.filter(m=>!m.d);ex.forEach(e=>e.l-=dt);ex=ex.filter(e=>e.l>0)},
d(c){bg(c,"#070b1a","#141a3a");stars(c,50,t*2);
c.fillStyle="#3ddca0";c.beginPath();c.moveTo(40,ly-18);c.lineTo(90,ly);c.lineTo(40,ly+18);c.closePath();c.fill();circ(c,36,ly,5+Math.random()*4,"#ffb347");
bs.forEach(b=>rr(c,b.x,b.y-2,16,4,2,"#9fe8ff"));

function loop(ts){if(!GM)return;const cv=$("#cv");if(!cv)return;const dt=Math.min(.05,(ts-(GM.last||ts))/1000);GM.last=ts;
const pf0=$("#pf");if(pf0&&CAM&&!I.pd)pf0.style.height=I.p+"%";if(CAM&&GM.T==="p"&&!hs()&&!I.pd)I.tp=0;

if(GM.on){const pp=I.p;I.p+=(I.tp-I.p)*Math.min(1,dt*14);if(pp<25&&I.p>=25)I.edge=true;
C.t+=dt;C.pn++;C.ps+=I.p;C.pm=Math.max(C.pm,I.p);GM.g.u(dt);I.edge=false;I.up=false;

FX.forEach(f=>{f.y-=30*dt;f.l-=dt});FX=FX.filter(f=>f.l>0);GM.lv=Math.max(0,GM.lv-dt);hud()}

raf=requestAnimationFrame(loop)}
